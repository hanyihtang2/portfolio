<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <style>
    :root {
      --bg-color: #18181b;
      --text-color: #ffffff;
      --border-color: rgba(255, 255, 255, 0.12);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #f4f4f5;
        --text-color: #18181b;
        --border-color: rgba(0, 0, 0, 0.12);
      }
    }
    .box {
      fill: var(--bg-color);
      stroke: var(--border-color);
    }
    .monogram {
      stroke: var(--text-color);
    }
  </style>

  <!-- Rounded Squircle / Button Container -->
  <rect class="box" x="1" y="1" width="30" height="30" rx="7.5" stroke-width="1" />

  <!-- Geometric 'H' and 'T' Monogram -->
  <g class="monogram" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(3.5, 4)">
    <!-- Geometric 'H' -->
    <path d="M4.5 6V18M4.5 12H10.5M10.5 6V18" />
    <!-- Geometric 'T' -->
    <path d="M13.5 6H20.5M17 6V18" />
  </g>
</svg>

